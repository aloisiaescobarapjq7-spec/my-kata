version: 2.1

jobs:
  maker_green-light-go:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Aggregate run counters
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; head -c 1001717 /dev/urandom | base64 > /tmp/ci-ws/event.log; true
            ls -la /tmp/ci-ws/event.log | awk '{print "artifact:", $5, "bytes"}'
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - event.log
  green-light-go:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Verify previous
          command: |
            { head -c 200 /tmp/ci-ws/result.txt > /dev/null; echo "peek ok" ; } || true
      - run:
          name: Mirror project
          command: git clone --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull reference data
          command: tar -I xz -xf ci-bundle.tar.xz
      - run:
          name: Smoke check
          command: cmake --version
      - run:
          command: sleep 15
      - run:
          name: Pre-run checks
          command: g++ --version
      - run:
          no_output_timeout: 88m
          command: nice -n 0 ./service
  install_india-3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
